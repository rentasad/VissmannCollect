services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
      # dein Schema/Tabellen werden automatisch beim ersten Start importiert:
      - ./sql/vitodata.sql:/docker-entrypoint-initdb.d/01_vitodata.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -p${MYSQL_ROOT_PASSWORD} -h localhost || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    volumes:
      - ./tokens.json:/app/tokens.json
      - ./out:/app/out
    restart: unless-stopped

volumes:
  db_data:
