services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-vitocal}
      MYSQL_USER: ${MYSQL_USER:-vitoapp}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-changeme}
    volumes:
      - db_data:/var/lib/mysql
      - ./sql/vitodata.sql:/docker-entrypoint-initdb.d/01_vitodata.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -p${MYSQL_ROOT_PASSWORD:-root} -h localhost || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    ports:
      - "3306:3306"

  app:
    environment:
      DATABASE_URL: "mysql+pymysql://${MYSQL_USER:-vitoapp}:${MYSQL_PASSWORD:-changeme}@db:3306/${MYSQL_DATABASE:-vitocal}"
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:
